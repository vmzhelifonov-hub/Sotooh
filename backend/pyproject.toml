[project]
name = "sotooh-backend"
version = "0.1.0"
description = "Sotooh вЂ” B2B SaaS for solar installers in Iraq. Django backend."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "argon2-cffi>=23.1",
    "django==5.1.*",
    "djangorestframework==3.16.*",
    "django-cors-headers==4.4.*",
    "django-filter==24.3",
    "drf-spectacular==0.28.*",
    "django-storages[s3]==1.14.*",
    "Pillow>=10.4",
    "psycopg[binary]==3.2.*",
    "gunicorn==23.*",
    "celery==5.4.*",
    "redis==5.0.*",
    "clickhouse-connect==0.7.*",
    "weasyprint>=66,<71",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "django-ratelimit==4.1",
    "django-redis>=5.4",
    "shortuuid>=1.0.13",
    "pytz>=2024.1",
    "django-environ>=0.11.2",
    "user-agents>=2.2",
]
[dependency-groups]
dev = [
    "pytest==8.*",
    "pytest-django==4.9.*",
    "factory-boy==3.3",
    "ruff==0.6.*",
    "mypy>=1.11",
    "django-stubs[compatible-mypy]==5.0.*",
    "freezegun>=1.5",
    "pypdf>=5,<7",
]
[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
[tool.uv]
package = false
[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint.per-file-ignores]
# Django settings modules intentionally use star imports from base settings
"config/settings/*" = ["F401", "F403", "F405"]
"apps/core/dashboard.py" = ["F401"]
[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["tests"]
