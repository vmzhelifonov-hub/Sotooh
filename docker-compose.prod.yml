name: sotooh

# Production stack for a small VPS (1 GB RAM / 20 GB disk).
#
# Running:     caddy, backend (gunicorn), postgres, redis, celery, frontend (static)
# Intentionally OFF (big data stack, see docs): clickhouse, minio, airflow.
# - Media storage: local persistent volume when USE_LOCAL_MEDIA=1 in .env,
#   or any external S3 provider via AWS_* — no code changes needed to switch.
# - Analytics (ClickHouse) stays code-supported but optional/best-effort.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - media_data:/srv/media:ro
    depends_on:
      - backend
      - frontend
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    # Conservative low-memory PostgreSQL (1 GB VPS)
    command: >
      postgres -c shared_buffers=64MB -c effective_cache_size=256MB
               -c max_connections=40 -c work_mem=2MB
               -c maintenance_work_mem=32MB -c wal_buffers=4MB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Small memory cap for the cache/broker on 1 GB VPS
    command: redis-server --maxmemory 48mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    # 2 gunicorn workers (NOT 2*CPU+1 — 1 GB RAM VPS), 4 threads each
    command: >
      sh -c "uv run python manage.py migrate --noinput &&
             uv run python manage.py collectstatic --noinput &&
             uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --threads 4 --worker-tmp-dir /dev/shm --timeout 120 --max-requests 500 --max-requests-jitter 50"
    volumes:
      - staticfiles:/app/staticfiles
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  celery:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    # Single low-concurrency worker (PDF/email queue only)
    command: uv run celery -A config worker -l info --concurrency 1
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *logging

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    logging: *logging

volumes:
  postgres_data:
  staticfiles:
  media_data:
  caddy_data:
  caddy_config:
